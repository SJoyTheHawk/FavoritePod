<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FavoritePod — Store artwork review</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 40px; color: #182b46; background: #f1f4f8; font: 16px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
      main { max-width: 1480px; margin: auto; }
      h1 { margin: 0; letter-spacing: -1px; font-size: 34px; }
      h2 { margin-top: 36px; font-size: 22px; }
      p { color: #51627b; }
      .row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 28px; }
      figure { margin: 0 0 24px; max-width: 100%; }
      img { display: block; max-width: 100%; height: auto; }
      figcaption { font-size: 13px; color: #51627b; margin-top: 10px; }
      .icon { padding: 20px; border-radius: 16px; background: white; }
      .dark { background: #182b46; }
      .dark figcaption { color: #dbeafe; }
      .wide { overflow-x: auto; }
      .wide img { max-width: none; }
      a { color: #2563eb; }
    </style>
  </head>
  <body>
    <main>
      <h1>FavoritePod store artwork</h1>
      <p>Detailed brand mark for promotion · simplified mark for the extension icon.</p>
      <h2>Small promotional image</h2>
      <div class="row">
        <figure><img src="small-promo-440x280.png" width="440" height="280" alt="Text-free FavoritePod promotional artwork" /><figcaption>Upload: 440 × 280 · RGB PNG</figcaption></figure>
        <figure><img src="small-promo-440x280.png" width="220" height="140" alt="Small promotion at half size" /><figcaption>Half-size recognition check: 220 × 140</figcaption></figure>
      </div>
      <h2>Marquee image</h2>
      <figure class="wide"><img src="marquee-1400x560.png" width="1400" height="560" alt="Wide text-free FavoritePod promotional artwork" /><figcaption>Upload: 1400 × 560 · RGB PNG · scroll horizontally on narrower screens</figcaption></figure>
      <figure><img src="marquee-1400x560.png" width="700" height="280" alt="Marquee at half size" /><figcaption>Half-size recognition check: 700 × 280</figcaption></figure>
      <h2>Extension icon</h2>
      <div class="row">
        <figure class="icon"><img src="extension-icon-128.png" width="128" height="128" alt="Extension icon on white" /><figcaption>128 × 128 · light</figcaption></figure>
        <figure class="icon dark"><img src="extension-icon-128.png" width="128" height="128" alt="Extension icon on dark blue" /><figcaption>128 × 128 · dark</figcaption></figure>
      </div>
      <h2>English-language alternatives</h2>
      <div class="row">
        <figure><img src="alternates/small-promo-440x280-en.png" width="440" height="280" alt="FavoritePod: Your favorites. One visual home." /><figcaption>Captioned small promotion: 440 × 280</figcaption></figure>
        <figure><img src="alternates/small-promo-440x280-en.png" width="220" height="140" alt="Captioned promotion at half size" /><figcaption>Half-size check</figcaption></figure>
      </div>
      <figure><img src="alternates/marquee-1400x560-en.png" width="1400" height="560" alt="FavoritePod: Your favorites. One visual home. Websites and local tools, beautifully organized." /><figcaption>Captioned marquee: 1400 × 560, scaled to fit this page</figcaption></figure>
      <p><a href="README.md">File details, source artwork, and regeneration instructions</a></p>
    </main>
  </body>
</html>
